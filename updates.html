<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matrix Updates</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#e8eef6;
    font-size:15px;
    line-height:1.35;
    padding:7.5px 10.5px;
  }
  h1{
    font-size:12.75px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#4da3ff;
    font-weight:700;
    margin-bottom:7.5px;
    padding-bottom:4.5px;
    border-bottom:1px solid #28313d;
  }
  .row{
    display:flex;
    align-items:baseline;
    gap:7.5px;
    padding:4.2px 0;
    border-bottom:1px solid rgba(40,49,61,.5);
  }
  .row:last-of-type{border-bottom:none}
  .tag{
    flex:0 0 auto;
    font-size:9.3px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:1.5px 4.8px;
    border-radius:3.0px;
    min-width:69.0px;
    text-align:center;
  }
  .added   .tag{background:rgba(61,220,132,.16);color:#3ddc84}
  .removed .tag{background:rgba(255,107,107,.16);color:#ff6b6b}
  .moved   .tag{background:rgba(255,209,102,.16);color:#ffd166}
  .edited  .tag{background:rgba(77,163,255,.16);color:#4da3ff}
  .body{flex:1;min-width:0}
  .txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail{
    display:block;
    font-size:12.0px;
    color:#8b98a8;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .when{
    flex:0 0 auto;
    font-size:10.799999999999999px;
    color:#6b7787;
    white-space:nowrap;
  }
  .more{
    margin-top:6.0px;
    font-size:11.700000000000001px;
    color:#8b98a8;
    font-style:italic;
  }
  .empty{color:#8b98a8;font-size:13.5px;padding:7.5px 0}
</style>
</head>
<body>

<h1>Matrix Updates</h1>
<div class="empty">No changes in the last 14 days</div>

<script>
// Relative timestamps, refreshed in the browser so the page doesn't
// need regenerating just to keep "2h ago" honest.
function rel(iso){
  const then = new Date(iso), now = new Date();
  if(isNaN(then)) return "";
  const s = Math.max(0,(now-then)/1000);
  if(s < 90)     return "just now";
  const m = Math.round(s/60);
  if(m < 60)     return m + "m ago";
  const h = Math.round(m/60);
  if(h < 24)     return h + "h ago";
  const d = Math.round(h/24);
  if(d === 1)    return "yesterday";
  if(d < 7)      return d + "d ago";
  return then.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function paint(){
  document.querySelectorAll(".when").forEach(el => {
    el.textContent = rel(el.dataset.ts);
  });
}
paint();
setInterval(paint, 60000);
// Pick up newly pushed versions of this page.
setTimeout(() => location.reload(), 10*60*1000);
</script>

</body>
</html>
