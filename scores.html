<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugheslandia Scoreboard</title>
<style>
  :root{
    --bg:#0b0f14;
    --card:#151b23;
    --card2:#1b222c;
    --line:#28313d;
    --txt:#e8eef6;
    --dim:#8b98a8;
    --win:#3ddc84;
    --loss:#ff6b6b;
    --draw:#ffd166;
    --live:#ff3b30;
    --accent:#4da3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:1.2vw 1.6vw;
    overflow:hidden;
  }
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--line);
    padding-bottom:.6vw;margin-bottom:1vw;
  }
  h1{font-size:2.1vw;letter-spacing:.04em;font-weight:700}
  #stamp{font-size:1.05vw;color:var(--dim)}
  #stamp.stale{color:var(--draw)}

  #board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1vw;
    align-content:start;
  }
  .group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:.8vw;
    overflow:hidden;
  }
  .group h2{
    font-size:1.15vw;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);font-weight:700;
    padding:.65vw .9vw;
    background:var(--card2);
    border-bottom:1px solid var(--line);
  }
  .row{
    display:flex;align-items:center;gap:.8vw;
    padding:.7vw .9vw;
    border-bottom:1px solid rgba(40,49,61,.55);
  }
  .row:last-child{border-bottom:none}
  .row img{width:2.6vw;height:2.6vw;object-fit:contain;flex:0 0 auto}
  .row .meta{flex:1;min-width:0}
  .team{font-size:1.25vw;font-weight:650;line-height:1.2}
  .sub{font-size:.95vw;color:var(--dim);line-height:1.35;margin-top:.15vw;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub .W{color:var(--win);font-weight:700}
  .sub .L{color:var(--loss);font-weight:700}
  .sub .D{color:var(--draw);font-weight:700}
  .rec{font-size:.95vw;color:var(--dim);flex:0 0 auto}

  .live{
    background:rgba(255,59,48,.10);
    border-left:.35vw solid var(--live);
  }
  .livetag{
    display:inline-block;background:var(--live);color:#fff;
    font-size:.75vw;font-weight:800;letter-spacing:.08em;
    padding:.1vw .4vw;border-radius:.25vw;margin-right:.4vw;
    vertical-align:middle;
  }

  .strip{grid-column:1 / -1}
  .stripwrap{display:flex;flex-wrap:wrap;gap:.5vw;padding:.8vw .9vw}
  .fixture{
    background:var(--card2);border:1px solid var(--line);
    border-radius:.4vw;padding:.4vw .7vw;font-size:.98vw;white-space:nowrap;
  }
  .fixture b{font-weight:750}
  .muted{color:var(--dim);font-size:1vw;padding:.8vw .9vw}
  #err{color:var(--draw);font-size:.9vw;margin-top:.6vw}
</style>
</head>
<body>

<header>
  <h1>SCOREBOARD</h1>
  <div id="stamp">loading…</div>
</header>

<div id="board"><div class="muted">Fetching scores…</div></div>
<div id="err"></div>

<script>
/* ============================================================
   HUGHESLANDIA SCOREBOARD
   Data: ESPN public site API (no key required)
   Edit the TEAMS list below to add/remove teams.
   Teams are resolved by NAME at runtime, so you never have to
   hunt down ESPN team IDs. If a name can't be matched, that row
   is skipped and reported in the footer instead of breaking.
   ============================================================ */

const TZ = "America/New_York";
const REFRESH_MINUTES = 8;

const TEAMS = [
  // ---- TAMPA BAY -------------------------------------------------
  { group:"Tampa Bay",  label:"Buccaneers",  sport:"football", league:"nfl",          match:"Tampa Bay Buccaneers" },
  { group:"Tampa Bay",  label:"Lightning",   sport:"hockey",   league:"nhl",          match:"Tampa Bay Lightning" },
  { group:"Tampa Bay",  label:"Rays",        sport:"baseball", league:"mlb",          match:"Tampa Bay Rays" },
  { group:"Tampa Bay",  label:"Rowdies",     sport:"soccer",   league:"usa.usl.1",    match:"Tampa Bay Rowdies" },

  // ---- MICHIGAN --------------------------------------------------
  { group:"Michigan",   label:"Football",    sport:"football",   league:"college-football",          match:"Michigan Wolverines" },
  { group:"Michigan",   label:"Men's Hoops", sport:"basketball", league:"mens-college-basketball",   match:"Michigan Wolverines" },
  { group:"Michigan",   label:"Women's Hoops",sport:"basketball",league:"womens-college-basketball", match:"Michigan Wolverines" },
  { group:"Michigan",   label:"Hockey",      sport:"hockey",     league:"mens-college-hockey",       match:"Michigan Wolverines" },
  { group:"Michigan",   label:"Baseball",    sport:"baseball",   league:"college-baseball",          match:"Michigan Wolverines" },

  // ---- PREMIER LEAGUE --------------------------------------------
  { group:"Premier League", label:"Man United", sport:"soccer", league:"eng.1", match:"Manchester United" },

  // ---- BASEBALL (WEST) -------------------------------------------
  { group:"Baseball",   label:"Mariners",    sport:"baseball", league:"mlb", match:"Seattle Mariners" },
  { group:"Baseball",   label:"Angels",      sport:"baseball", league:"mlb", match:"Los Angeles Angels" },
  { group:"Baseball",   label:"Padres",      sport:"baseball", league:"mlb", match:"San Diego Padres" },

  // ---- DENVER ----------------------------------------------------
  { group:"Denver",     label:"Broncos",     sport:"football", league:"nfl", match:"Denver Broncos" },
];

// Order the group cards appear on screen
const GROUP_ORDER = ["Tampa Bay","Michigan","Premier League","Baseball","Denver"];

// Show a strip of recent Premier League results under the cards
const EPL_STRIP = { enabled:true, daysBack:5, max:10 };

// ---------------------------------------------------------------

const API = "https://site.api.espn.com/apis/site/v2/sports";
const rosterCache = {};
const problems = [];

const norm = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}

async function resolveTeam(sport, league, match){
  const key = sport+"/"+league;
  if(!rosterCache[key]){
    rosterCache[key] = getJSON(`${API}/${sport}/${league}/teams?limit=1000`)
      .then(d => (d?.sports?.[0]?.leagues?.[0]?.teams || []).map(t => t.team))
      .catch(() => []);
  }
  const teams = await rosterCache[key];
  const want = norm(match);
  let hit = teams.find(t => norm(t.displayName) === want);
  if(!hit) hit = teams.find(t => norm(t.displayName).includes(want) || want.includes(norm(t.displayName)));
  if(!hit) hit = teams.find(t => norm(t.location+t.name) === want);
  if(!hit) hit = teams.find(t => norm(t.shortDisplayName) === want);
  return hit || null;
}

function scoreOf(c){
  if(c.score == null) return null;
  if(typeof c.score === "object") return c.score.displayValue ?? c.score.value ?? null;
  return c.score;
}

function pickEvents(events){
  let live=null, last=null, next=null;
  for(const ev of events||[]){
    const comp = ev.competitions?.[0];
    if(!comp) continue;
    const st = comp.status?.type || ev.status?.type || {};
    const t = new Date(ev.date).getTime();
    if(st.state === "in"){ live = ev; }
    else if(st.completed || st.state === "post"){
      if(!last || t > new Date(last.date).getTime()) last = ev;
    } else {
      if(!next || t < new Date(next.date).getTime()) next = ev;
    }
  }
  return {live,last,next};
}

function sides(ev, myId){
  const comp = ev.competitions?.[0] || {};
  const cs = comp.competitors || [];
  const me = cs.find(c => String(c.team?.id) === String(myId)) || cs[0];
  const opp = cs.find(c => c !== me) || {};
  return {comp, me, opp};
}

function oppName(opp){
  const t = opp.team || {};
  return t.abbreviation || t.shortDisplayName || t.displayName || "TBD";
}

function fmtDate(iso){
  return new Date(iso).toLocaleString("en-US",{
    timeZone:TZ, weekday:"short", month:"numeric", day:"numeric",
    hour:"numeric", minute:"2-digit"
  }).replace(",","");
}

function finalLine(ev, myId){
  const {me,opp} = sides(ev,myId);
  const a = scoreOf(me), b = scoreOf(opp);
  if(a == null || b == null) return "Final";
  let r = "D";
  if(me.winner === true) r = "W";
  else if(opp.winner === true) r = "L";
  else if(Number(a) > Number(b)) r = "W";
  else if(Number(a) < Number(b)) r = "L";
  const vs = me.homeAway === "home" ? "vs" : "@";
  return `<span class="${r}">${r}</span> ${a}–${b} ${vs} ${oppName(opp)}`;
}

function liveLine(ev, myId){
  const {comp,me,opp} = sides(ev,myId);
  const a = scoreOf(me) ?? 0, b = scoreOf(opp) ?? 0;
  const det = comp.status?.type?.shortDetail || comp.status?.type?.detail || "";
  const vs = me.homeAway === "home" ? "vs" : "@";
  return `<span class="livetag">LIVE</span>${a}–${b} ${vs} ${oppName(opp)} · ${det}`;
}

function nextLine(ev, myId){
  const {me,opp} = sides(ev,myId);
  const vs = me.homeAway === "home" ? "vs" : "@";
  return `${fmtDate(ev.date)} ${vs} ${oppName(opp)}`;
}

function recordOf(data){
  const r = data?.team?.recordSummary
         || data?.team?.record?.items?.[0]?.summary
         || "";
  return r;
}

async function buildTeamRow(cfg){
  const team = await resolveTeam(cfg.sport, cfg.league, cfg.match);
  if(!team){ problems.push(`${cfg.group}/${cfg.label}: no match in ${cfg.league}`); return null; }

  let data;
  try{
    data = await getJSON(`${API}/${cfg.sport}/${cfg.league}/teams/${team.id}/schedule`);
  }catch(e){
    problems.push(`${cfg.group}/${cfg.label}: schedule unavailable`);
    data = {events:[]};
  }

  const {live,last,next} = pickEvents(data.events);
  const logo = team.logos?.[0]?.href
            || `https://a.espncdn.com/i/teamlogos/${cfg.league}/500/${(team.abbreviation||"").toLowerCase()}.png`;

  let sub, isLive = false;
  if(live){ sub = liveLine(live, team.id); isLive = true; }
  else{
    const bits = [];
    if(last) bits.push(finalLine(last, team.id));
    if(next) bits.push(nextLine(next, team.id));
    sub = bits.join("  ·  ") || "Offseason";
  }

  const rec = recordOf(data);

  return `<div class="row${isLive?" live":""}">
    <img src="${logo}" alt="" onerror="this.style.visibility='hidden'">
    <div class="meta">
      <div class="team">${cfg.label}</div>
      <div class="sub">${sub}</div>
    </div>
    ${rec ? `<div class="rec">${rec}</div>` : ""}
  </div>`;
}

function ymd(d){
  return d.getFullYear().toString()
       + String(d.getMonth()+1).padStart(2,"0")
       + String(d.getDate()).padStart(2,"0");
}

async function eplStrip(){
  if(!EPL_STRIP.enabled) return "";
  const end = new Date();
  const start = new Date(Date.now() - EPL_STRIP.daysBack*864e5);
  let d;
  try{
    d = await getJSON(`${API}/soccer/eng.1/scoreboard?dates=${ymd(start)}-${ymd(end)}&limit=100`);
  }catch(e){ return ""; }

  const items = [];
  for(const ev of d.events || []){
    const comp = ev.competitions?.[0]; if(!comp) continue;
    const st = comp.status?.type || {};
    const cs = comp.competitors || [];
    const home = cs.find(c=>c.homeAway==="home") || cs[0];
    const away = cs.find(c=>c.homeAway==="away") || cs[1];
    if(!home || !away) continue;
    const hs = scoreOf(home), as = scoreOf(away);
    const h = home.team?.shortDisplayName || home.team?.abbreviation || "";
    const a = away.team?.shortDisplayName || away.team?.abbreviation || "";
    if(st.state === "in"){
      items.push(`<div class="fixture"><span class="livetag">LIVE</span><b>${h} ${hs}–${as} ${a}</b></div>`);
    }else if(st.completed || st.state === "post"){
      items.push(`<div class="fixture"><b>${h} ${hs}–${as} ${a}</b></div>`);
    }
  }
  if(!items.length) return "";
  return `<div class="group strip">
    <h2>Premier League — Recent Results</h2>
    <div class="stripwrap">${items.slice(-EPL_STRIP.max).join("")}</div>
  </div>`;
}

async function render(){
  problems.length = 0;
  const rows = await Promise.all(TEAMS.map(async cfg => ({cfg, html: await buildTeamRow(cfg)})));

  const byGroup = {};
  for(const {cfg,html} of rows){
    if(!html) continue;
    (byGroup[cfg.group] ||= []).push(html);
  }

  const names = GROUP_ORDER.filter(g => byGroup[g])
                .concat(Object.keys(byGroup).filter(g => !GROUP_ORDER.includes(g)));

  let out = names.map(g =>
    `<div class="group"><h2>${g}</h2>${byGroup[g].join("")}</div>`
  ).join("");

  out += await eplStrip();

  document.getElementById("board").innerHTML = out || `<div class="muted">No data returned.</div>`;

  const stamp = document.getElementById("stamp");
  stamp.textContent = "updated " + new Date().toLocaleString("en-US",
    {timeZone:TZ, hour:"numeric", minute:"2-digit", month:"numeric", day:"numeric"});
  stamp.classList.remove("stale");

  document.getElementById("err").textContent =
    problems.length ? "Not shown: " + problems.join(" · ") : "";
}

async function tick(){
  try{ await render(); }
  catch(e){
    document.getElementById("stamp").classList.add("stale");
    document.getElementById("err").textContent = "Refresh failed: " + e.message;
  }
}

tick();
setInterval(tick, REFRESH_MINUTES * 60 * 1000);
// Full page reload once a day so the board never drifts on a long-running Pi
setTimeout(() => location.reload(), 24*60*60*1000);
</script>
</body>
</html>
